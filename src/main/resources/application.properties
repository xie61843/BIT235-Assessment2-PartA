# The application listens on port 8080 and renders Thymeleaf views without
# caching templates, so edits appear on the next browser refresh.

server.port=8080

# Disable the template cache during development and demonstration.
spring.thymeleaf.cache=false

# Show friendly error pages instead of stack traces in the browser.
server.error.whitelabel.enabled=false
